name: Update data
on:
  schedule:
    - cron: "0 14 * * *"     # 14:00 UTC, USGS has usually published the previous day by then
  workflow_dispatch:          # manual trigger from the Actions tab

permissions:
  contents: write             # lets the workflow commit

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install dataretrieval pandas
      - run: python pipeline.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/observations.csv
          git commit -m "Data of $(date +%F)" || echo "Nothing new to commit"
          git push
